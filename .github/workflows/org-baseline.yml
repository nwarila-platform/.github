name: Org Baseline

# Org-baseline drift gate. Runs on every PR in every repository under
# nwarila-platform via the org's repository ruleset (configured separately;
# see docs/how-to/configure-org-rulesets.md).
#
# This workflow is NEVER copied into consumer repos. Consumers don't add
# anything to their .github/workflows/ — the org ruleset injects this
# workflow into every PR run automatically. The single source of truth is
# this file at nwarila-platform/.github/.github/workflows/org-baseline.yml.
#
# Behavior
# --------
# Delegates to NWarila/drift-gate, a SHA-pinned composite action that:
#   - checks out consumer (PR head) and the canonical source side-by-side
#   - byte-compares every file in baseline-manifest.json
#   - emits per-file annotations to the GitHub Check Runs API (failures
#     appear inline in the PR's "Files changed" view)
#   - exits non-zero on any drift, so a repository ruleset can require it
#
# We pin source-ref to github.workflow_sha so the manifest, the action,
# and the workflow logic all come from the same revision — no possibility
# of internal drift between the workflow's idea of "the baseline" and
# what's actually on disk in the org repo.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: org-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # Skip when running against the org canonical itself — it's not a consumer
    # of the baseline; it IS the baseline. Consumer repos go through this gate
    # via the org repository ruleset; the canonical's own PRs are gated by
    # self-CI (manifest schema + on-disk source verification) instead.
    if: github.repository != format('{0}/.github', github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drift gate (org baseline)
        # renovate: datasource=github-tags depName=NWarila/drift-gate
        uses: NWarila/drift-gate@973c3a9e4cee3000118e39a0cc9014eb6f4972a1 # main @ 2026-05-08
        with:
          source-repo: ${{ github.repository_owner }}/.github
          source-ref: ${{ github.workflow_sha }}
          manifest: baseline-manifest.json
          check-name: org-baseline / verify
