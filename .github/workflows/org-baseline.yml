name: Org Baseline

# Org-baseline drift gate. Runs on every PR in every repository under
# nwarila-platform via the org's repository ruleset (configured separately;
# see docs/how-to/configure-org-rulesets.md).
#
# This workflow is NEVER copied into consumer repos. Consumers don't add
# anything to their .github/workflows/ — the org ruleset injects this
# workflow into every PR run automatically. The single source of truth is
# this file at nwarila-platform/.github/.github/workflows/org-baseline.yml.
#
# Behavior
# --------
# 1. Check out the consumer's PR head into ./consumer
# 2. Check out nwarila-platform/.github at the same revision the workflow
#    file was loaded from (github.workflow_sha) into ./org. The Python
#    tooling, the manifest, and the workflow logic are all from one
#    revision — no possibility of internal drift.
# 3. Install the org-baseline Python package from the org checkout.
# 4. Run python -m org_baseline.cli with --output-mode check-run, which:
#      - byte-compares every file in baseline-manifest.json
#      - emits structured per-file annotations to GitHub Check Runs API
#        (so failures appear inline in the PR's "Files changed" view)
#      - exits non-zero on any failure (gate)
# 5. Branch protection on the consumer's main requires the resulting
#    "org-baseline / verify" check, blocking merge on failure.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: org-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # Skip when running against the org canonical itself — it's not a consumer
    # of the baseline; it IS the baseline. Consumer repos go through this gate
    # via the org repository ruleset; the canonical's own PRs are gated by
    # self-CI (pytest + ruff + manifest schema) instead.
    if: github.repository != format('{0}/.github', github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out consumer (PR head)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: consumer
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out nwarila-platform/.github at workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: nwarila-platform/.github
          # The same revision the workflow file was loaded from. Guarantees
          # manifest, Python tooling, and workflow logic come from one tree.
          ref: ${{ github.workflow_sha }}
          path: org
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: org/pyproject.toml

      - name: Install org-baseline package
        working-directory: org
        run: python -m pip install --no-cache-dir .

      - name: Run baseline check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          python -m org_baseline.cli \
            --consumer-root consumer \
            --org-root org \
            --manifest org/baseline-manifest.json \
            --output-mode check-run \
            --head-sha "${PR_HEAD_SHA}" \
            --repo "${REPO}" \
            --step-summary "${GITHUB_STEP_SUMMARY}"
