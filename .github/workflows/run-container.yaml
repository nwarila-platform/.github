# Purpose: Provide contract 2's single execution path for factory-built workflow containers.
# Role: Validate declared requirements, verify the factory identity, run, report, and restore status.
# Contract 1 lives at 0188f9cc9d325aaa1d173286da9a2ba99210b09c.
name: Run workflow container
on:
  workflow_call:
    inputs:
      name: {required: true, type: string}
      version: {required: true, type: string}
      contract: {required: true, type: number}
      digest: {required: true, type: string}
      expect: {required: false, type: string, default: pass}
permissions:
  contents: read
jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # Required by A14 for SARIF from the single runner job.
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            prod.app-api.stepsecurity.io:443
            productionresultssa*.blob.core.windows.net:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            *.githubapp.com:443
      - name: Validate image tuple
        id: validation
        continue-on-error: ${{ inputs.expect == 'refuse' }}
        env:
          NAME: "${{ inputs.name }}"
          VERSION: "${{ inputs.version }}"
          CONTRACT: "${{ inputs.contract }}"
          DIGEST: "${{ inputs.digest }}"
          EXPECT: "${{ inputs.expect }}"
        run: |
          set -euo pipefail
          refuse() {
            printf '%s\n' "$1" >&2
            printf 'reason=%s\n' "$1" >>"$GITHUB_OUTPUT"
            exit 2
          }
          if [[ ${#NAME} -gt 91 || ! "$NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            refuse 'input validation: invalid name'
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            refuse 'input validation: version must be strict X.Y.Z'
          fi
          if [[ "$CONTRACT" != "2" ]]; then
            refuse 'input validation: contract must be 2'
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            refuse 'input validation: invalid digest'
          fi
          if [[ "$EXPECT" != "pass" && "$EXPECT" != "refuse" ]]; then
            refuse 'input validation: expect must be pass or refuse'
          fi
          image="ghcr.io/nwarila-platform/workflow-${NAME}"
          identity="https://github.com/nwarila-platform/workflow-container-factory/.github/workflows/build.yaml@refs/tags/${NAME}/v${VERSION}"
          printf 'image=%s\nidentity=%s\n' "$image" "$identity" >>"$GITHUB_OUTPUT"
      - if: steps.validation.outcome == 'success'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {path: workspace, persist-credentials: false, fetch-depth: 1}
      - if: steps.validation.outcome == 'success'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v2.5.2}
      - name: Verify factory signature and tag
        id: signature
        if: steps.validation.outcome == 'success'
        continue-on-error: ${{ inputs.expect == 'refuse' }}
        env:
          NAME: "${{ inputs.name }}"
          IMAGE: "${{ steps.validation.outputs.image }}"
          IDENTITY: "${{ steps.validation.outputs.identity }}"
          VERSION: "${{ inputs.version }}"
          DIGEST: "${{ inputs.digest }}"
        run: |
          set -euo pipefail
          refuse() {
            printf '%s\n' "$1" >&2
            printf 'reason=%s\n' "$1" >>"$GITHUB_OUTPUT"
            exit 2
          }
          verify() {
            local reference=$1 output=$2 error=$3 status
            set +e
            cosign verify "$reference" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository nwarila-platform/workflow-container-factory \
              --certificate-github-workflow-ref "refs/tags/${NAME}/v${VERSION}" \
              -o json >"$output" 2>"$error"
            status=$?
            set -e
            cat "$output"
            cat "$error" >&2
            return "$status"
          }
          digest_result="$RUNNER_TEMP/digest-verification.json"
          digest_error="$RUNNER_TEMP/digest-verification.err"
          if ! verify "$IMAGE@$DIGEST" "$digest_result" "$digest_error"; then
            if grep -Fq 'no matching signatures' "$digest_result" "$digest_error"; then
              refuse 'signature verification: no matching signatures'
            fi
            exit 2
          fi
          verified=$(jq -er '.[0].critical.image["docker-manifest-digest"] | select(test("^sha256:[0-9a-f]{64}$"))' "$digest_result") || refuse 'signature verification: invalid verification result'
          [[ "$verified" == "$DIGEST" ]] || refuse 'signature verification: image digest does not match the pinned digest'

          tag_result="$RUNNER_TEMP/tag-verification.json"
          tag_error="$RUNNER_TEMP/tag-verification.err"
          if ! verify "$IMAGE:$VERSION" "$tag_result" "$tag_error"; then
            if grep -Fq 'no matching signatures' "$tag_result" "$tag_error"; then
              refuse 'signature verification: no matching signatures'
            fi
            exit 2
          fi
          verified=$(jq -er '.[0].critical.image["docker-manifest-digest"] | select(test("^sha256:[0-9a-f]{64}$"))' "$tag_result") || refuse 'signature verification: invalid verification result'
          [[ "$verified" == "$DIGEST" ]] || refuse 'signature verification: version tag does not match the pinned digest'
          printf 'ref=%s@%s\n' "$IMAGE" "$DIGEST" >>"$GITHUB_OUTPUT"
      - name: Check declared requirements
        id: labels
        if: steps.signature.outcome == 'success'
        continue-on-error: ${{ inputs.expect == 'refuse' }}
        env:
          IMAGE: "${{ steps.signature.outputs.ref }}"
        run: |
          set -euo pipefail
          refuse() {
            printf '%s\n' "$1" >&2
            printf 'reason=%s\n' "$1" >>"$GITHUB_OUTPUT"
            exit 2
          }
          docker pull --quiet "$IMAGE" >/dev/null
          labels=$(docker image inspect --format '{{json .Config.Labels}}' "$IMAGE")
          requirements=(scratch second-input full-history sarif image-input)
          for requirement in "${requirements[@]}"; do
            key="org.nwarila.workflow.${requirement}"
            if ! jq -e --arg key "$key" 'has($key)' <<<"$labels" >/dev/null; then
              refuse "label check: missing $key"
            fi
            value=$(jq -er --arg key "$key" '.[$key] | select(. == "true" or . == "false")' <<<"$labels") || refuse "label check: invalid $key"
            if [[ "$value" == "true" && "$requirement" =~ ^(full-history|sarif|image-input)$ ]]; then
              refuse "label check: declared requirement $requirement is not provided by contract 2 yet"
            fi
            printf '%s=%s\n' "${requirement//-/_}" "$value" >>"$GITHUB_OUTPUT"
          done
      - name: Decide refusal expectation
        if: always()
        env:
          EXPECT: "${{ inputs.expect }}"
          VALIDATION_OUTCOME: "${{ steps.validation.outcome }}"
          VALIDATION_REASON: "${{ steps.validation.outputs.reason }}"
          SIGNATURE_OUTCOME: "${{ steps.signature.outcome }}"
          SIGNATURE_REASON: "${{ steps.signature.outputs.reason }}"
          LABEL_OUTCOME: "${{ steps.labels.outcome }}"
          LABEL_REASON: "${{ steps.labels.outputs.reason }}"
        run: |
          set -euo pipefail
          if [[ "$EXPECT" != "refuse" ]]; then
            [[ "$VALIDATION_OUTCOME" == success && "$SIGNATURE_OUTCOME" == success && "$LABEL_OUTCOME" == success ]]
            exit
          fi
          if [[ "$VALIDATION_OUTCOME" == failure && -n "$VALIDATION_REASON" ]]; then
            printf 'expected refusal observed: %s\n' "$VALIDATION_REASON"
            exit 0
          fi
          [[ "$VALIDATION_OUTCOME" == success ]] || exit 2
          if [[ "$SIGNATURE_OUTCOME" == failure && -n "$SIGNATURE_REASON" ]]; then
            printf 'expected refusal observed: %s\n' "$SIGNATURE_REASON"
            exit 0
          fi
          [[ "$SIGNATURE_OUTCOME" == success ]] || exit 2
          if [[ "$LABEL_OUTCOME" == failure && -n "$LABEL_REASON" ]]; then
            printf 'expected refusal observed: %s\n' "$LABEL_REASON"
            exit 0
          fi
          [[ "$LABEL_OUTCOME" == success ]] || exit 2
          echo 'expected a refusal, but the image was accepted' >&2
          exit 2
      - name: Prepare pinned inputs
        if: inputs.expect == 'pass' && steps.labels.outcome == 'success'
        env:
          NAME: ${{ inputs.name }}
          TEMPLATES: ${{ steps.labels.outputs.second_input }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config=".github/.config/${NAME}.yaml"
          lock=".github/.config/${NAME}.lock"
          : >"$RUNNER_TEMP/pins"
          mkdir -p templates
          if [[ "$TEMPLATES" != "true" ]]; then exit 0; fi
          [[ -e "workspace/$config" ]] || { echo "::error::missing $config"; exit 2; }
          if [[ "$EVENT" == pull_request ]]; then
            git -C workspace fetch --quiet --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" || { echo "::error::cannot fetch protected base"; exit 2; }
            git -C workspace show "origin/$BASE:$config" >"$RUNNER_TEMP/identity" || { echo "::error::cannot read protected identity"; exit 2; }
            git -C workspace show "origin/$BASE:$lock" >"$RUNNER_TEMP/base-lock" || { echo "::error::cannot read protected lock"; exit 2; }
            identity="$RUNNER_TEMP/identity"
            head="workspace/$lock"
            base="$RUNNER_TEMP/base-lock"
          else
            identity="workspace/$config"
            head="workspace/$lock"
            base="workspace/$lock"
          fi
          python3 - "$identity" "$head" "$base" "$OWNER" "$REPOSITORY" "$EVENT" >"$RUNNER_TEMP/pins" <<'PY'
          import re, sys
          identity, head, base, owner, own, event = sys.argv[1:]
          def fail(message): print(f"::error::{message}", file=sys.stderr); raise SystemExit(2)
          def read(path):
              raw = open(path, "rb").read()
              if not raw.endswith(b"\n") or b"\r" in raw or b"\0" in raw: fail(f"invalid LF grammar: {path}")
              try: return raw.decode("ascii").splitlines()
              except UnicodeDecodeError: fail(f"non-ASCII input: {path}")
          def main():
              lines = read(identity)
              item = re.compile(r"  - ([A-Za-z0-9_.-]+)(?:/([A-Za-z0-9_.-]+))?")
              if not lines or lines[0] != "templates:" or any(not item.fullmatch(x) for x in lines[1:]): fail("invalid identity grammar")
              templates = []
              for line in lines[1:]:
                  match = item.fullmatch(line)
                  templates.append(f"{match[1]}/{match[2]}" if match[2] else f"{owner}/{match[1]}")
              folded = [x.lower() for x in templates]
              if not templates or len(set(folded)) != len(folded): fail("identity entries must be nonempty and unique")
              expected = [x for x in templates if x.lower() != own.lower()]
              def locks(path):
                  result = []
                  for line in read(path):
                      match = re.fullmatch(r"([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+) ([0-9a-f]{40})", line)
                      if not match: fail(f"invalid lock grammar: {path}")
                      result.append(match.groups())
                  if [x for x, _ in result] != expected: fail(f"lock list does not match protected identity: {path}")
                  return dict(result)
              new, old = locks(head), locks(base)
              for repo in expected: print(repo, new[repo], old[repo] if event == "pull_request" else "-")
          try: main()
          except SystemExit: raise
          except Exception: fail("cannot read pinned inputs")
          PY
          index=0
          while read -r repo oid old; do
            directory="templates/$index"
            git init -q "$directory"
            git -C "$directory" remote add origin "https://github.com/$repo.git"
            git -C "$directory" fetch --quiet --depth=1 origin "$oid" || { echo "::error::cannot fetch $repo@$oid"; exit 2; }
            git -C "$directory" checkout --quiet --detach FETCH_HEAD
            [[ $(git -C "$directory" rev-parse HEAD) == "$oid" ]] || { echo "::error::checkout OID mismatch for $repo"; exit 2; }
            read -r default private < <(gh api "repos/$repo" --jq '[.default_branch,.private] | @tsv') || { echo "::error::cannot read metadata for $repo"; exit 2; }
            [[ "$private" == false ]] || { echo "::error::$repo must be public"; exit 2; }
            status=$(gh api "repos/$repo/compare/$oid...$default" --jq .status) || { echo "::error::cannot prove reachability for $repo@$oid"; exit 2; }
            [[ "$status" == ahead || "$status" == identical ]] || { echo "::error::$repo@$oid is not reachable from $default"; exit 2; }
            if [[ "$EVENT" == pull_request ]]; then
              status=$(gh api "repos/$repo/compare/$old...$oid" --jq .status) || { echo "::error::cannot prove non-rewind for $repo"; exit 2; }
              [[ "$status" == ahead || "$status" == identical ]] || { echo "::error::lock rewinds $repo"; exit 2; }
            fi
            index=$((index + 1))
          done <"$RUNNER_TEMP/pins"
      - name: Evaluate
        id: evaluate
        if: inputs.expect == 'pass' && steps.labels.outcome == 'success'
        env:
          NAME: "${{ inputs.name }}"
          IMAGE: "${{ steps.signature.outputs.ref }}"
          TEMPLATES: "${{ steps.labels.outputs.second_input }}"
          SCRATCH: "${{ steps.labels.outputs.scratch }}"
        run: |
          set -euo pipefail
          chmod -R a+rX workspace templates
          docker pull --quiet "$IMAGE" >/dev/null
          mounts=()
          args=()
          index=0
          while read -r repo _ _; do
            mounts+=(-v "$PWD/templates/$index:/templates/$index:ro")
            args+=(--template "$repo=/templates/$index")
            index=$((index + 1))
          done <"$RUNNER_TEMP/pins"
          scratch=()
          if [[ "$SCRATCH" == "true" ]]; then
            scratch=(--tmpfs "/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777" --tmpfs "/home/nonroot:rw,nosuid,nodev,noexec,size=16m,mode=1777")
          fi
          if docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges "${scratch[@]}" -v "$PWD/workspace:/workspace:ro" "${mounts[@]}" "$IMAGE" --workspace /workspace "${args[@]}" --format text >report.txt 2>error.txt; then status=0; else status=$?; fi
          if [[ ! "$status" =~ ^[012]$ ]]; then status=2; fi
          if [[ "$status" -eq 0 ]]; then
            size=$(wc -c <report.txt)
            if [[ "$size" -eq 0 ]]; then
              status=2
            elif ! tail -n 1 report.txt | LC_ALL=C grep -qaxE "${NAME}: (PASS|WARNING)( \\([ -'*-~]+\\))?"; then
              status=2
            elif [[ "$(tail -c 1 report.txt | od -An -tx1)" != " 0a" ]]; then
              status=2
            elif [[ "$size" -ge 2 && "$(tail -c 2 report.txt | head -c 1 | od -An -tx1)" == " 0a" ]]; then
              status=2
            fi
          fi
          printf '{"problemMatcher":[{"owner":"workflow-containers","pattern":[{"regexp":"^(error|warning): ([^:]+?): (.*)$","severity":1,"file":2,"message":3}]}]}\n' >"$RUNNER_TEMP/matcher.json"
          echo "::add-matcher::$RUNNER_TEMP/matcher.json"
          cat report.txt
          cat error.txt >&2
          case "$status" in
            0) result='passed' ;;
            1) result='failed' ;;
            *) result='could not complete' ;;
          esac
          printf '### %s\n\nThe check %s. The full report is in the log of the Evaluate step.\n' "$NAME" "$result" >>"$GITHUB_STEP_SUMMARY"
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
      - name: Restore checker status
        if: inputs.expect == 'pass'
        env:
          STATUS: ${{ steps.evaluate.outputs.status }}
        run: exit "$STATUS"
