name: Self CI

# Validates the org's baseline-manifest.json before it lands on main.
# A broken manifest would cause every consumer PR's drift gate to fail,
# so we catch it here in the canonical repo's own CI instead.
#
# Two checks:
#   1. Manifest parses against drift-gate's Pydantic schema.
#   2. Every `source` path in the manifest exists on disk in this repo
#      (otherwise consumers would see SOURCE_MISSING for that entry).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifest:
    name: validate manifest
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install drift-gate (manifest schema)
        # renovate: datasource=github-tags depName=NWarila/drift-gate
        run: >-
          python -m pip install --no-cache-dir
          'git+https://github.com/NWarila/drift-gate@d835ae411f1e55e25b2b6c079d5891e7345a043c'

      - name: Validate baseline-manifest.json
        run: |
          python - <<'PY'
          from pathlib import Path
          from baseline.manifest import load_manifest

          manifest_path = Path("baseline-manifest.json")
          m = load_manifest(manifest_path)
          print(f"manifest: version={m.version}, files={len(m.files)}")

          missing = [f.source for f in m.files if not Path(f.source).is_file()]
          if missing:
              print("ERROR: manifest entries reference sources missing on disk:")
              for s in missing:
                  print(f"  - {s}")
              raise SystemExit(1)
          print("all sources resolve on disk")
          PY

  adr-schema:
    name: validate ADR schema
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Validate ADR schema
        run: python tools/check_adr_schema.py
        env:
          ADR_SCHEMA_BASE_REF: origin/${{ github.base_ref }}

  repo-hygiene-smoke:
    name: smoke reusable-repo-hygiene
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-repo-hygiene.yaml
    with:
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  codeql-smoke:
    name: smoke reusable-codeql
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-codeql.yaml

  iac-security-smoke:
    name: smoke reusable-iac-security
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-iac-security.yaml

  scorecard-smoke:
    name: smoke reusable-scorecard
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-scorecard.yaml

  auto-merge-smoke:
    name: smoke reusable-auto-merge
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reusable-auto-merge.yaml
    with:
      smoke: true

  release-please-smoke:
    name: smoke reusable-release-please
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: ./.github/workflows/reusable-release-please.yaml
    with:
      smoke: true

  org-adr-auto-sync-smoke:
    name: smoke reusable-org-adr-auto-sync
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-org-adr-auto-sync.yaml
    with:
      source_repo: nwarila-platform/.github
      source_ref: main
      smoke: true
