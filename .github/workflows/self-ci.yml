name: Self CI

# Tests the org-baseline tooling itself. The runtime gate (org-baseline.yml)
# only works if this Python module is correct; this CI prevents regressions
# from landing on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install org-baseline + dev deps
        run: python -m pip install --no-cache-dir '.[dev]'

      - name: Run pytest
        run: python -m pytest tests/ -v

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        # renovate: datasource=pypi depName=ruff
        run: python -m pip install --no-cache-dir ruff==0.13.0

      - name: Lint
        run: ruff check tools/ tests/

      - name: Format check
        run: ruff format --check tools/ tests/

  schema-self-check:
    name: schema (production manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --no-cache-dir .

      - name: Validate baseline-manifest.json against schema
        run: |
          python -c "
          from pathlib import Path
          from org_baseline.manifest import load_manifest
          m = load_manifest(Path('baseline-manifest.json'))
          print(f'manifest: version={m.version}, files={len(m.files)}')
          for f in m.files:
              if not Path(f.source).is_file():
                  raise SystemExit(f'manifest entry source missing on disk: {f.source}')
          print('all sources resolve on disk')
          "
