[project]
name = "org-baseline"
version = "0.1.0"
description = "Org-baseline drift check for nwarila-platform — verifies consumer repos mirror the canonical org files"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.13,<1",
]

[project.scripts]
org-baseline = "org_baseline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/org_baseline"]

[tool.hatch.build.targets.wheel.sources]
"tools/org_baseline" = "org_baseline"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
